name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    env:
      RELEASE_VERSION: 0.1.${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Set automatic release version
        run: npm version "${{ env.RELEASE_VERSION }}" --no-git-tag-version --allow-same-version

      - name: Check and test frontend
        run: |
          npm run check
          npm test

      - name: Build and publish desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ env.RELEASE_VERSION }}
          releaseName: Issue Note v${{ env.RELEASE_VERSION }}
          releaseBody: Download the installer for your platform. These builds are not notarized or code-signed.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  prune-releases:
    name: Keep the latest 20 releases
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Delete older releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --repo "$GH_REPO" --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
          while IFS= read -r tag; do
            [ -n "$tag" ] && gh release delete "$tag" --repo "$GH_REPO" --cleanup-tag --yes
          done
